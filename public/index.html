<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Social Poster</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="module" src="/js/pages/dashboard.js"></script>
</head>
<body>
  <div class="app-loading" id="app-loading"><span class="spinner"></span>Loading...</div>
  <main id="page" hidden>
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="/calendar.html" data-icon="calendar">View calendar</a>
        <a class="btn btn-primary" href="/create.html" data-icon="plus">Create post</a>
      </div>
    </div>

    <div id="onboarding"></div>
    <section class="stats" id="stats" aria-label="Key figures"></section>

    <div class="grid-2 mb-20">
      <section class="card">
        <div class="card-head"><h2>Needs attention</h2><a class="btn btn-ghost btn-sm" href="/posts.html?status=failed,partial">View all</a></div>
        <div id="attention"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Coming up</h2><a class="btn btn-ghost btn-sm" href="/calendar.html">Open calendar</a></div>
        <div id="upcoming"></div>
      </section>
    </div>

    <div class="grid-2">
      <section class="card">
        <div class="card-head"><h2>Recent posts</h2><a class="btn btn-ghost btn-sm" href="/posts.html">Post history</a></div>
        <div id="recent"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Connected accounts</h2><a class="btn btn-ghost btn-sm" href="/accounts.html">Manage</a></div>
        <div id="accounts"></div>
      </section>
    </div>
  </main>
</body>
</html>
