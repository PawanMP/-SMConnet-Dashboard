<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found - Social Poster</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="module" src="/js/pages/static.js"></script>
</head>
<body data-page="none" data-title="Page not found">
  <div class="app-loading" id="app-loading"><span class="spinner"></span>Loading...</div>
  <main id="page" hidden>
    <section class="card"><div class="empty">
      <div class="empty-icon"><span data-icon="search"></span></div>
      <h3>Page not found</h3>
      <p>The page you were looking for does not exist or has moved.</p>
      <a class="btn btn-primary" href="/" data-icon="dashboard">Go to the dashboard</a>
    </div></section>
  </main>
</body>
</html>
